openapi: 3.1.0
info:
  title: Meta Pedigree API
  version: 0.1.0
  description: R1 contract. See docs/design/api.md for conventions.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /orgs:
    get:
      operationId: searchOrgs
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: org list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgPage" }
  /orgs/{id}:
    get:
      operationId: getOrg
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: org detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "404": { description: not found }
  /tree:
    get:
      operationId: getTree
      parameters:
        - { name: root, in: query, schema: { type: string, format: uuid } }
        - { name: depth, in: query, schema: { type: integer, maximum: 6, default: 3 } }
      responses:
        "200":
          description: nodes and edges
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: "#/components/schemas/Node" } }
                  edges: { type: array, items: { $ref: "#/components/schemas/Edge" } }
  /facts/{id}:
    get:
      operationId: getFact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: fact with sources, conflicts, revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
  /facts:
    post:
      operationId: createFact
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactInput" }
      responses:
        "201":
          description: created (draft)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        "422": { description: validation error }
  /registry/relation-types:
    get:
      operationId: listRelationTypes
      responses:
        "200":
          description: registry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RelationType" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Org:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [company, party, faction, state_actor, lab] }
        country_code: { type: string, nullable: true }
        founded:
          $ref: "#/components/schemas/Temporal"
        dissolved:
          $ref: "#/components/schemas/Temporal"
    Temporal:
      type: object
      nullable: true
      properties:
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        precision: { type: string, enum: [day, month, year, unknown] }
        qualifier: { type: string, enum: [exact, circa, before, after, between, unknown] }
    Node:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        has_source: { type: boolean }
    Edge:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject: { type: string, format: uuid }
        object: { type: string, format: uuid }
        predicate: { type: string }
        period: { $ref: "#/components/schemas/Temporal" }
        certainty: { type: string, enum: [exact, approximate, disputed, unknown] }
    Fact:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject: { $ref: "#/components/schemas/Ref" }
        predicate: { type: string }
        object: { $ref: "#/components/schemas/Ref" }
        period: { $ref: "#/components/schemas/Temporal" }
        certainty: { type: string, enum: [exact, approximate, disputed, unknown] }
        status: { type: string, enum: [draft, in_review, published, disputed, superseded] }
        has_source: { type: boolean }
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        conflicts: { type: array, items: { type: string, format: uuid } }
        revision_of: { type: string, format: uuid, nullable: true }
    Ref:
      type: object
      properties:
        kind: { type: string, enum: [org, person, state, issue] }
        id: { type: string, format: uuid, nullable: true }
        name: { type: string }
    Source:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [book, article, url, archive] }
        title: { type: string }
        author: { type: string, nullable: true }
        url: { type: string, nullable: true }
        accessed_at: { type: string, format: date-time }
    FactInput:
      type: object
      required: [subject, predicate, object]
      properties:
        subject: { $ref: "#/components/schemas/Ref" }
        predicate: { type: string }
        object: { $ref: "#/components/schemas/Ref" }
        period: { $ref: "#/components/schemas/Temporal" }
        certainty: { type: string }
        attrs: { type: object, additionalProperties: true }
        no_source: { type: boolean }
    RelationType:
      type: object
      properties:
        code: { type: string }
        label_zh: { type: string }
        label_en: { type: string }
        domain: { type: string }
        implied_parent: { type: boolean }
        symmetric: { type: boolean }
